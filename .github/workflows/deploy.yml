name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt actions/checkout, actions/cache, etc. into the Node 24 runtime now.
  # Avoids the Node 20 deprecation warning until those actions ship a v5.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Gate: typecheck + sim tests must pass before any deploy.
  # ──────────────────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            client/node_modules
            server/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            sim/.zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('sim/build.zig', 'sim/build.zig.zon', 'sim/src/**', 'sim/test/**') }}
          restore-keys: ${{ runner.os }}-zig-
      - run: bun install --frozen-lockfile
      - run: bun run sim:fmt
      - run: bun run sim:test
      - run: bun run sim:build
      - run: bun run --filter client typecheck
      - run: bun run --filter server typecheck
      - run: bun run --filter client test
      - run: bun run --filter server test

  # ──────────────────────────────────────────────────────────────────────
  # Deploy Convex (lobby + matches schema/functions) to production.
  # Convex is a separate deploy target — neither Vercel nor Fly cover it.
  # Without this job a `convex/` change ships in git but the prod schema
  # stays stale, producing ArgumentValidationError on the client (e.g.
  # "Object contains extra field `mapId`" — bedeff5..31b7780 trail).
  #
  # Secret: CONVEX_DEPLOY_KEY  (Convex dashboard → Settings →
  #   Deploy Keys → Production → Generate). Distinct from the dev
  #   deploy key in .env.local; that one is for `bunx convex dev`.
  # ──────────────────────────────────────────────────────────────────────
  deploy-convex:
    name: Deploy Convex (prod)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Surface the deploy target URL so deploy-client can verify
    # Vercel's VITE_CONVEX_URL points at the SAME deployment.
    # Without this guard, dev/prod URL drift silently ships the
    # client against a stale schema (the Object-contains-extra-
    # field-`mapId` class of bug).
    outputs:
      convexUrl: ${{ steps.push.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Push functions + schema to Convex
        id: push
        run: |
          set -o pipefail
          # Capture stdout to a file while letting the CLI's progress
          # also appear in the live job log (tee).
          bunx convex deploy --yes 2>&1 | tee /tmp/convex-deploy.log
          # Extract the deployment URL from the CLI's "Deploying to
          # https://X.convex.cloud..." line. The trailing "..." is
          # stripped. Fail loudly if we can't find it — silent failure
          # would defeat the purpose of the guard.
          URL=$(grep -oE 'https://[a-z0-9-]+\.convex\.cloud' /tmp/convex-deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not parse Convex deploy URL from CLI output."
            cat /tmp/convex-deploy.log
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Convex deploy target: $URL"
        env:
          # The deploy key tells the CLI which deployment to push to;
          # no other Convex env vars are needed for prod.
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  # ──────────────────────────────────────────────────────────────────────
  # Deploy Bun game server to Fly.io.
  # Triggers on changes to server/, fly.toml, or shared sim code.
  # Secret: FLY_API_TOKEN  (create with `flyctl tokens create deploy -a jakesjam-srv-sin`)
  # ──────────────────────────────────────────────────────────────────────
  deploy-server:
    name: Deploy server (Fly.io)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip server deploy when only client/convex/docs changed.
    # (Change-detection per-job is messy in Actions; cheaper to always run
    # when verify passes — Fly skips re-pushing identical images anyway.)
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # Build the wasm artifact so the Dockerfile's
      #   COPY client/public/wasm ./client/public/wasm
      # finds it in the build context. Without this, the depot
      # builder fails with "client/public/wasm: not found" because
      # client/public/wasm/sim.wasm is gitignored — it's a build
      # artifact regenerated by `zig build`.
      - name: Build sim.wasm for Docker COPY
        run: cd sim && zig build
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.toml --app jakesjam-srv-sin --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Deploy Vite client to Vercel (production).
  # Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # Get IDs from .vercel/project.json after `vercel link`, or the dashboard.
  # ──────────────────────────────────────────────────────────────────────
  deploy-client:
    name: Deploy client (Vercel)
    # Decoupled from deploy-server: when Fly is down (e.g. billing lapsed,
    # platform incident, or the trial expired) we still want the static
    # client build to ship. The client has CONVEX_URL_FALLBACK + a
    # client-side reconnect path, so a stale-server scenario is degraded
    # but not broken. Was previously `[verify, deploy-server]`.
    #
    # Depends on deploy-convex so we can VERIFY that VITE_CONVEX_URL
    # in Vercel matches the URL `bunx convex deploy` actually pushed
    # to. Mismatch = client builds against a stale Convex schema =
    # ArgumentValidationError on every changed mutation. Caught here
    # at CI time instead of surfacing as a user-facing prod bug.
    needs: [verify, deploy-convex]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Vercel CLI
        run: bun add -g vercel@latest
      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # Fail-loud guard for the recurring "Set VITE_CONVEX_URL to enable rooms"
      # bug: if neither the Vercel project env nor a GitHub secret carries
      # VITE_CONVEX_URL, write it from the GH secret CONVEX_URL_PROD into
      # .env.production at the workspace root (vite.config.ts has envDir: "..").
      # If both are empty, FAIL the build — shipping a broken lobby is worse
      # than a red CI badge.
      - name: Ensure VITE_CONVEX_URL is set for the build + matches Convex deploy target
        env:
          GH_CONVEX_URL: ${{ secrets.CONVEX_URL_PROD }}
          # The URL `bunx convex deploy` actually pushed to in the
          # deploy-convex job above. The client MUST build against
          # the same deployment or we ship stale-schema bugs.
          DEPLOY_TARGET_URL: ${{ needs.deploy-convex.outputs.convexUrl }}
        run: |
          set -e
          PULLED_ENV_FILE=".vercel/.env.production.local"
          PULLED_URL=""
          if [ -f "$PULLED_ENV_FILE" ]; then
            PULLED_URL=$(grep -E '^VITE_CONVEX_URL=' "$PULLED_ENV_FILE" | head -1 | cut -d'=' -f2- | sed 's/^"//; s/"$//') || true
          fi
          # Resolve the URL that the build will actually use. Order
          # matches the runtime resolution: Vercel env > GH secret >
          # in-app fallback (CONVEX_URL_FALLBACK in LobbyController).
          BUILD_URL=""
          BUILD_SOURCE=""
          if [ -n "$PULLED_URL" ]; then
            BUILD_URL="$PULLED_URL"
            BUILD_SOURCE="Vercel project env"
          elif [ -n "$GH_CONVEX_URL" ]; then
            echo "VITE_CONVEX_URL missing from Vercel env; falling back to GH secret CONVEX_URL_PROD."
            echo "VITE_CONVEX_URL=${GH_CONVEX_URL}" >> .env.production
            BUILD_URL="$GH_CONVEX_URL"
            BUILD_SOURCE="GH secret CONVEX_URL_PROD"
          fi

          if [ -z "$BUILD_URL" ]; then
            echo "::warning::VITE_CONVEX_URL is not set in Vercel project env AND CONVEX_URL_PROD GitHub secret is empty. Build will use the in-app CONVEX_URL_FALLBACK. Verify it matches the deploy target ($DEPLOY_TARGET_URL)."
            exit 0
          fi

          echo "VITE_CONVEX_URL build value: $BUILD_URL  (source: $BUILD_SOURCE)"
          echo "Convex deploy target:        $DEPLOY_TARGET_URL"
          # Strip trailing slash, lowercase host for comparison robustness.
          NORMALIZED_BUILD=$(echo "$BUILD_URL" | sed 's:/*$::' | tr '[:upper:]' '[:lower:]')
          NORMALIZED_TARGET=$(echo "$DEPLOY_TARGET_URL" | sed 's:/*$::' | tr '[:upper:]' '[:lower:]')
          if [ "$NORMALIZED_BUILD" != "$NORMALIZED_TARGET" ]; then
            echo "::error::VITE_CONVEX_URL ($BUILD_URL) does NOT match the Convex deployment we just pushed to ($DEPLOY_TARGET_URL). The client would build against a stale-schema deployment. Fix one of:"
            echo "::error::  (a) Vercel project → Settings → Environment Variables → VITE_CONVEX_URL = $DEPLOY_TARGET_URL"
            echo "::error::  (b) Repo Secrets → CONVEX_URL_PROD = $DEPLOY_TARGET_URL"
            echo "::error::  (c) Repo Secrets → CONVEX_DEPLOY_KEY → use a deploy key for the deployment Vercel is configured for"
            exit 1
          fi
          echo "VITE_CONVEX_URL matches the Convex deploy target. OK."
      # Same fallback dance for VITE_GAME_SERVER_URL — the prod game-server
      # WS endpoint. When the Bun server is hosted on Fly the matchmaker
      # carries this; while Fly is down we drive it from a GitHub secret
      # (typically a tunnel URL pointing at a local dev server).
      - name: Ensure VITE_GAME_SERVER_URL is set for the build
        env:
          GH_GAME_SERVER_URL: ${{ secrets.GAME_SERVER_URL_PROD }}
        run: |
          set -e
          # GH secret WINS over Vercel env for this var. Reason: the
          # Vercel project env is locked to the Fly URL (set early) but
          # the actual prod target switches between Fly + tunnel as Fly
          # billing fluctuates. Updating the GH secret is one CLI call;
          # updating Vercel env is delete-and-recreate (Sensitive flag
          # is one-way) and a redeploy. So the GH secret is the
          # operational override knob.
          if [ -n "$GH_GAME_SERVER_URL" ]; then
            echo "VITE_GAME_SERVER_URL=${GH_GAME_SERVER_URL}" >> .env.production
            echo "VITE_GAME_SERVER_URL set from GH secret GAME_SERVER_URL_PROD (length=${#GH_GAME_SERVER_URL}). OK."
            exit 0
          fi
          PULLED_ENV_FILE=".vercel/.env.production.local"
          PULLED_URL=""
          if [ -f "$PULLED_ENV_FILE" ]; then
            PULLED_URL=$(grep -E '^VITE_GAME_SERVER_URL=' "$PULLED_ENV_FILE" | head -1 | cut -d'=' -f2- | sed 's/^"//; s/"$//') || true
          fi
          if [ -n "$PULLED_URL" ]; then
            echo "VITE_GAME_SERVER_URL inherited from Vercel project env (GH secret empty; length=${#PULLED_URL}). OK."
            exit 0
          fi
          echo "::warning::VITE_GAME_SERVER_URL is not set anywhere; client will use the localhost default (broken in prod). Add GH secret GAME_SERVER_URL_PROD."
      - name: Build (Vercel prebuilt)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

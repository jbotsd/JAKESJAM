name: Typecheck & Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache Bun install dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            client/node_modules
            server/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            sim/.zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('sim/build.zig', 'sim/build.zig.zon', 'sim/src/**', 'sim/test/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sim — fmt check
        run: bun run sim:fmt

      - name: Sim — Zig tests
        run: bun run sim:test

      - name: Sim — build wasm
        run: bun run sim:build

      - name: Typecheck (client)
        run: bun run --filter client typecheck

      - name: Typecheck (server)
        run: bun run --filter server typecheck

      - name: Test (sim)
        run: bun run --filter client test

      - name: Test (server)
        run: bun run --filter server test

      - name: Build (client production)
        run: bun run build

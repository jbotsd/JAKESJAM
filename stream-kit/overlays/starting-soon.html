<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JAKESJAM — Starting Soon</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="screen">
      <div class="ring" aria-hidden="true"></div>
      <div class="ring ring-2" aria-hidden="true"></div>
      <div class="ring ring-3" aria-hidden="true"></div>
      <div class="tri" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <!-- φ rings + hex + nested upright triangle cascade -->
          <circle cx="50" cy="52" r="46" stroke="#50e3c2" stroke-width="0.7" opacity="0.28" />
          <circle cx="50" cy="52" r="28.4" stroke="#8ff8ff" stroke-width="0.6" opacity="0.28" />
          <circle cx="50" cy="52" r="17.6" stroke="#50e3c2" stroke-width="0.55" opacity="0.32" />
          <polygon points="50,6 74,20 74,48 50,62 26,48 26,20" stroke="#50e3c2" stroke-width="0.7" opacity="0.35" />
          <rect x="22" y="24" width="56" height="56" stroke="#90a8b8" stroke-width="0.55" opacity="0.25" transform="rotate(45 50 52)" />
          <polygon points="50,6 94,90 6,90" stroke="#50e3c2" stroke-width="1.4" opacity="0.8" />
          <polygon points="50,20 78,76 22,76" stroke="#c9a84c" stroke-width="0.85" opacity="0.55" />
          <polygon points="50,30 70,70 30,70" stroke="#8ff8ff" stroke-width="0.9" opacity="0.45" />
          <polygon points="50,38 62,64 38,64" stroke="#50e3c2" stroke-width="0.75" opacity="0.4" />
          <line x1="50" y1="6" x2="50" y2="90" stroke="#8ff8ff" stroke-width="0.4" opacity="0.25" />
          <line x1="6" y1="90" x2="94" y2="90" stroke="#50e3c2" stroke-width="0.4" opacity="0.2" />
          <circle cx="50" cy="58" r="2.5" fill="#8ff8ff" opacity="0.9" />
          <circle cx="50" cy="58" r="1" fill="#c9a84c" />
        </svg>
      </div>
      <div class="screen-kicker">Friday Night · Hot Lobby</div>
      <div class="screen-title">Starting Soon</div>
      <div class="screen-rule" aria-hidden="true"></div>
      <div class="screen-sub">Open play · draft · stack</div>
      <div class="screen-link">play.elyad.io</div>
      <div class="screen-foot">Jakesjam · vessel · spark · void</div>
    </div>
  </body>
</html>

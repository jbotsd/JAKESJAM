<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile: lock zoom (the game handles its own scaling), fill the screen
         edge-to-edge, and extend under notches (safe-area insets in CSS). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Crystal-arena brawler. Predict, parry, draft. Jump straight into the live world — no install."
    />
    <title>JAKESJAM — crystal-arena brawler</title>

    <!-- ── Share card (Open Graph + Twitter) ─────────────────────────
         __ORIGIN__ is rewritten to the request origin by the game
         server's static handler at serve time (server/src/index.ts) so
         the card works on ANY host: the funnel domain, LAN, a future
         VPS domain. Scrapers require ABSOLUTE image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JAKESJAM" />
    <meta property="og:title" content="JAKESJAM — crystal-arena brawler" />
    <meta
      property="og:description"
      content="1v1–8P arena duels with rogue-lite card drafts. Predict, parry, draft. Play in the browser — no install."
    />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:image" content="__ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two crystal duelists clash mid-parry in the JAKESJAM arena" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JAKESJAM — crystal-arena brawler" />
    <meta
      name="twitter:description"
      content="1v1–8P arena duels with rogue-lite card drafts. Play in the browser — no install."
    />
    <meta name="twitter:image" content="__ORIGIN__/og-image.png" />
    <meta name="theme-color" content="#06181c" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Display + mono fonts: Space Grotesk (headers, card titles) + Space Mono (numerics, HUD) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

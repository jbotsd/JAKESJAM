<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CrazyGames SDK v3 (portal submission requirement). Loaded as an
         ordinary synchronous script — NOT async/defer/module — so
         window.CrazyGames exists (or definitively fails to load) before
         the module bundle (main.ts) runs; module scripts are always
         deferred until after synchronous scripts + DOM parsing. Every
         call site is environment-gated in client/src/shell/crazyGamesSdk.ts:
         this tag is harmless on play.elyad.io / local dev even if the
         script 404s or the SDK reports environment "disabled" there. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <!-- Boot diagnostic (mobile has no devtools): surface ANY uncaught error /
         rejection as an on-screen red overlay so a black-screen failure is
         legible. Inline in <head> so it runs before the module bundle and
         catches module-load failures too. Harmless when nothing throws. -->
    <script>
      (function () {
        // Ignore wallet/extension noise (Phantom, MetaMask, etc. fight over
        // window.ethereum and throw "Cannot redefine property: ethereum").
        // Those must NOT paint our full-screen boot overlay — looks like a
        // game black-screen crash but the game never ran the bad code.
        function isExtensionNoise(msg, file, stack) {
          var s = String(msg || "") + "\n" + String(file || "") + "\n" + String(stack || "");
          if (/chrome-extension:|moz-extension:|safari-extension:|webkit-masked-url:/i.test(s))
            return true;
          if (/Cannot redefine property:\s*ethereum/i.test(s)) return true;
          if (/evmAsk\.js|inpage\.js|contentscript/i.test(s)) return true;
          // Browsers fire this as a real ErrorEvent even though it describes
          // no actual failure (a ResizeObserver callback took too long to
          // settle within one frame) — well-documented benign noise. Left
          // unfiltered it paints the same "the game crashed" red overlay a
          // real failure would, over live gameplay, which is worse than the
          // silence it's meant to replace.
          if (/ResizeObserver loop/i.test(s)) return true;
          return false;
        }
        function show(label, detail) {
          var d = document.getElementById("jj-boot-err");
          if (!d) {
            d = document.createElement("div");
            d.id = "jj-boot-err";
            d.style.cssText =
              "position:fixed;inset:0;z-index:99999;background:#180505;color:#ff9a9a;font:12px/1.4 monospace;padding:16px;overflow:auto;white-space:pre-wrap;";
            (document.body || document.documentElement).appendChild(d);
          }
          d.textContent += label + ": " + detail + "\n\n";
        }
        window.addEventListener("error", function (e) {
          var stack = (e.error && e.error.stack) || "";
          if (isExtensionNoise(e.message, e.filename, stack)) return;
          show("ERROR", (e.message || "") + "\n" + (stack || e.filename || ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason || {};
          var msg = typeof r === "string" ? r : r.message || "";
          var stack = typeof r === "object" && r ? r.stack || "" : "";
          if (isExtensionNoise(msg, "", stack)) return;
          show("PROMISE", msg + "\n" + stack);
        });
      })();
    </script>
    <!-- Right-click is the aegis power-slide input. The browser context menu
         must NEVER appear over the game — this is the EARLIEST, most reliable
         layer: a capture-phase handler installed inline in <head>, before the
         module bundle loads and before any canvas exists, so there is no
         timing window in which a right-click can slip through. Also suppresses
         `auxclick`. Independent of Phaser and of main.ts (which add their own
         layers) so no single failure re-enables the menu. -->
    <script>
      (function () {
        var kill = function (e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        };
        window.addEventListener("contextmenu", kill, { capture: true });
        document.addEventListener("contextmenu", kill, { capture: true });
        window.addEventListener("auxclick", function (e) {
          if (e.button === 2) kill(e);
        }, { capture: true });
        document.documentElement.oncontextmenu = kill;
      })();
    </script>
    <!-- Mobile: lock zoom (the game handles its own scaling), fill the screen
         edge-to-edge, and extend under notches (safe-area insets in CSS). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Ten space wizard ninjas, one arena, zero downloads. Parry rockets back into people's faces. The ultimate 1v1-me destination — Fight Night every Friday."
    />
    <title>JAKESJAM — the ultimate 1v1-me destination</title>

    <!-- ── Share card (Open Graph + Twitter) ─────────────────────────
         __ORIGIN__ is rewritten to the request origin by the game
         server's static handler at serve time (server/src/index.ts) so
         the card works on ANY host: the funnel domain, LAN, a future
         VPS domain. Scrapers require ABSOLUTE image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JAKESJAM" />
    <meta property="og:title" content="JAKESJAM — the ultimate 1v1-me destination" />
    <meta
      property="og:description"
      content="Ten space wizard ninjas, one arena, zero downloads. Parry rockets back into people's faces. Fight Night every Friday."
    />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:image" content="__ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JAKESJAM — gnostic gold sigil, ten space wizard ninjas, one arena, zero downloads" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JAKESJAM — the ultimate 1v1-me destination" />
    <meta
      name="twitter:description"
      content="Ten space wizard ninjas, one arena, zero downloads. Fight Night every Friday."
    />
    <meta name="twitter:image" content="__ORIGIN__/og-image.png" />
    <meta name="theme-color" content="#06181c" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Display + mono fonts: Space Grotesk (headers, card titles) + Space Mono (numerics, HUD) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

    <line x1="441.0" y1="51.9" x2="437.6" y2="26.1" stroke-width="2"/>
  </g>
  <!-- seven vowels = seven spheres -->
  <g font-family="'Noto Serif Display','Noto Serif',serif" font-size="30" fill="#e8e4d6" fill-opacity="0.9">
    <text x="604.8" y="117.8" text-anchor="middle">Α</text>
    <text x="891.2" y="404.2" text-anchor="middle">Ε</text>
    <text x="786.4" y="795.4" text-anchor="middle">Η</text>
    <text x="395.2" y="900.2" text-anchor="middle">Ι</text>
    <text x="108.8" y="613.8" text-anchor="middle">Ο</text>
    <text x="213.6" y="222.6" text-anchor="middle">Υ</text>
    <text x="604.8" y="117.8" text-anchor="middle">Ω</text>
  </g>
  <!-- THE CRYSTAL: large inscribed diamond (rotated square), vertices on the
       cardinal axes, inscribed exactly in the r=340 seventh ring. Hard-edged,
       instrument-like — the game's crystal-munitions grammar at seal scale. -->
  <polygon points="500,160 840,500 500,840 160,500" stroke="url(#svTeal)" stroke-width="3"/>
  <!-- vertex loop on the east point (the maker's pause — carried over from
       the old seal's single vertex detail so the mark stays authored) -->
  <circle cx="840" cy="500" r="16" stroke="url(#svTeal)" stroke-width="2.5"/>
  <!-- monad spark at the heart of the crystal -->
  <circle cx="500" cy="500" r="8" fill="#ffecaa" fill-opacity="0.9"/>
  <!-- compass diamonds at the four cardinal points -->
  <g fill="#ffecaa" fill-opacity="0.9">
    <polygon points="500,-8 520,12 500,32 480,12"/>
    <polygon points="1008,480 1028,500 1008,520 988,500"/>
    <polygon points="500,968 520,988 500,1008 480,988"/>
    <polygon points="-8,480 12,500 -8,520 -28,500"/>
  </g>
</svg>

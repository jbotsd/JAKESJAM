<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1060 1060" fill="none">
  <!-- JAKESJAM vessel seal — avionics-dial grammar (docs/visual-language-gnostic-vessel.md).
       Concentric hebdomad rings + tick band + compass diamonds + one large
       inscribed CRYSTAL DIAMOND (rotated square, vertices on the cardinal
       axes, inscribed in the seventh ring) with the gold monad spark at its
       heart. Replaces seal-gnostic.png. HARD CONSTRAINT (owner): no
       eye-under/inside-triangle, no triangle capping ring geometry around a
       focal center, no hexagram/pentagram — see docs/IDENT-GRAMMAR.md. -->
  <defs>
    <linearGradient id="svGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6a2a"/>
      <stop offset="45%" stop-color="#c9a84c"/>
      <stop offset="52%" stop-color="#ffedb0"/>
      <stop offset="60%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#7a5c22"/>
    </linearGradient>
    <linearGradient id="svTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e8f7a"/>
      <stop offset="48%" stop-color="#7fe8d8"/>
      <stop offset="54%" stop-color="#d8fff6"/>
      <stop offset="62%" stop-color="#50e3c2"/>
      <stop offset="100%" stop-color="#2e8f7a"/>
    </linearGradient>
  </defs>
  <!-- hebdomad ring stack: pure dial/instrument read -->
  <g stroke="url(#svGold)" stroke-width="2" opacity="0.8">
    <circle cx="500" cy="500" r="95"/>
    <circle cx="500" cy="500" r="128"/>
    <circle cx="500" cy="500" r="160"/>
    <circle cx="500" cy="500" r="196"/>
    <circle cx="500" cy="500" r="238"/>
    <circle cx="500" cy="500" r="286"/>
    <circle cx="500" cy="500" r="340"/>
  </g>
  <!-- boundary ring with the seam at top (the way out) -->
  <path d="M 545.9 11.6 A 490 490 0 1 1 454.1 11.6" stroke="url(#svGold)" stroke-width="5" stroke-linecap="round"/>
  <!-- radius line: center to the seam, faint (instrument needle at rest) -->
  <line x1="500" y1="500" x2="500" y2="10" stroke="#ffecaa" stroke-width="2" opacity="0.35"/>
  <!-- fixed-star tick band -->
  <g stroke="url(#svGold)" opacity="0.85">
    <line x1="500.0" y1="68.0" x2="500.0" y2="22.0" stroke-width="5"/>
    <line x1="559.0" y1="51.9" x2="562.4" y2="26.1" stroke-width="2"/>
    <line x1="617.0" y1="63.4" x2="623.7" y2="38.3" stroke-width="2"/>

interface:
  display_name: "Improve Codebase Architecture"
  short_description:
    - "Surface deepening opportunities — refactors that turn shallow modules into deep ones for testability and AI-navigability."
    - "Uses `CONTEXT.md` domain vocabulary and `docs/adr/*.md` to avoid re-litigating decisions."
    - "Triggers on 'improve architecture', 'refactor', 'tight coupling', or 'make more testable'."
  brand_color: "#94a3b8"

policy:
  allow_implicit_invocation: true

default_prompt: |
  When analyzing JAKESJAM's codebase for architectural improvement, follow this process using the domain terms from `CONTEXT.md` and architecture terms from `LANGUAGE.md`:

  1. **Explore friction**: Use `subagent_type=Explore` to walk the codebase. Look for modules where understanding one concept requires bouncing across many files, or where the interface is nearly as complex as the implementation (shallow). Apply the deletion test: if deleting the module concentrates complexity, it's earning its keep.

  2. **Identify opportunities**: Present numbered candidates with:
     - **Files**: which modules are involved
     - **Problem**: why friction exists (e.g., shallow, no locality)
     - **Solution**: plain English of the deepened interface
     - **Benefits**: explain improved locality, leverage, and test surface

     Use domain terms like "the Order intake module" (from `CONTEXT.md`) plus ADR-aware language. If an ADR conflict exists, mark it: `_contradicts ADR-0007 — but worth reopening because..._`.

  3. **Grilling loop**: When a user picks a candidate, design the deepened module inline:
     - Name the module after the concept in `CONTEXT.md` (or add to it)
     - Sharpen fuzzy terms immediately in `CONTEXT.md`
     - If the user rejects with a load-bearing reason, offer an ADR: `_Want me to record this as an ADR so future reviews don't re-suggest it?_`
     - For alternative interfaces, see [INTERFACE-DESIGN.md](../grill-with-docs/INTERFACE-DESIGN.md)

  4. **Interface discipline**:
     - One adapter = hypothetical seam; two adapters = real seam
     - Keep caller knowledge minimal but complete (not partial, not over-specified)
     - Use satisfiable, non-possum types where possible

  5. **Deepening test**: After designing, walk through what tests survive, what tests need updating, and what new tests the deepened interface enables.
